# .github/workflows/deploy-dev.yml
name: Deploy to dev
on:
  # dev infra (Terraform state/DynamoDB/cluster, ECR repos, CI IAM role) is provisioned --
  # infra/terraform/envs/{shared,dev} have been applied. This still needs the
  # AWS_CI_ROLE_ARN / KUBECONFIG_DEV repo secrets and DEV_HOST repo variable set in GitHub
  # (Settings > Secrets and variables > Actions) before a push-triggered run can succeed --
  # see the values this Terraform state produced in the PR/commit that enabled this trigger.
  push:
    branches: [main]
    paths-ignore:
      - 'infra/k8s/helm/*/values-prod.yaml'
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [mcp-server, scheduler, api-backend, frontend, stock-scanner-mcp, tradingview-mcp]
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: us-east-1
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Build and push
        run: |
          docker build -f services/${{ matrix.service }}/Dockerfile -t ${{ steps.ecr.outputs.registry }}/${{ matrix.service }}:${{ github.sha }} .
          docker push ${{ steps.ecr.outputs.registry }}/${{ matrix.service }}:${{ github.sha }}
        if: matrix.service != 'frontend'
      - name: Build and push frontend
        run: |
          docker build -f frontend/Dockerfile -t ${{ steps.ecr.outputs.registry }}/frontend:${{ github.sha }} frontend
          docker push ${{ steps.ecr.outputs.registry }}/frontend:${{ github.sha }}
        if: matrix.service == 'frontend'

  deploy-dev:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: us-east-1
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_DEV }}" | base64 -d > $HOME/.kube/config
      - name: Deploy each chart
        run: |
          # Matches infra/terraform/modules/s3's stock-research-tool-payloads-${env}-<account-id>
          # naming convention. Not a secret -- the account ID is already public in every ECR/DynamoDB
          # ARN this workflow touches -- so it's inlined here rather than needing its own repo variable.
          TOOL_PAYLOADS_BUCKET="stock-research-tool-payloads-dev-228281126655"
          for chart in mcp-server scheduler api-backend frontend stock-scanner-mcp tradingview-mcp; do
            # Each Helm chart's templates/secret.yaml (mcp-server, scheduler, api-backend) defines the
            # SHAPE of these secrets but not the key material -- these --set flags are what actually
            # populate them from GitHub Actions secrets. Without this, every deploy silently ships with
            # empty provider API keys: no /healthz-visible failure, but every tool call against
            # Finnhub/FMP/FRED/Marketaux 401s.
            EXTRA_SET=()
            case "$chart" in
              mcp-server)
                EXTRA_SET=(
                  --set finnhubApiKey="${{ secrets.FINNHUB_API_KEY }}"
                  --set fmpApiKey="${{ secrets.FMP_API_KEY }}"
                  --set fredApiKey="${{ secrets.FRED_API_KEY }}"
                  --set marketauxApiKey="${{ secrets.MARKETAUX_API_KEY }}"
                  --set toolPayloadsBucket="$TOOL_PAYLOADS_BUCKET"
                )
                ;;
              scheduler)
                EXTRA_SET=(
                  --set toolPayloadsBucket="$TOOL_PAYLOADS_BUCKET"
                  --set langfusePublicKey="${{ secrets.LANGFUSE_PUBLIC_KEY }}"
                  --set langfuseSecretKey="${{ secrets.LANGFUSE_SECRET_KEY }}"
                )
                ;;
              api-backend)
                EXTRA_SET=(
                  --set langfusePublicKey="${{ secrets.LANGFUSE_PUBLIC_KEY }}"
                  --set langfuseSecretKey="${{ secrets.LANGFUSE_SECRET_KEY }}"
                )
                ;;
            esac
            helm upgrade --install "$chart" "infra/k8s/helm/$chart" \
              -n dev --create-namespace -f "infra/k8s/helm/$chart/values-dev.yaml" \
              --set image=${{ steps.ecr.outputs.registry }}/$chart --set tag=${{ github.sha }} \
              "${EXTRA_SET[@]}" --wait --timeout 5m
          done
      - name: Run smoke test against dev
        run: |
          chmod +x scripts/smoke_test.sh
          DEV_HOST=${{ vars.DEV_HOST }} ./scripts/smoke_test.sh
