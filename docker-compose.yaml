services:
  dynamodb-local:
    image: amazon/dynamodb-local:2.5.4
    ports: ["8000:8000"]
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]

  mcp-server:
    build:
      context: .
      dockerfile: services/mcp-server/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
    ports: ["8001:8001"]
    depends_on: [dynamodb-local]

  scheduler:
    build:
      context: .
      dockerfile: services/scheduler/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
      OWN_MCP_SERVER_URL: http://mcp-server:8001/mcp
      # tradingview/stock_scanner are third-party MCP servers, not defined in this compose
      # file -- their real endpoints must be supplied via the root .env (see .env.example).
      TRADINGVIEW_MCP_URL: ${TRADINGVIEW_MCP_URL:-}
      STOCK_SCANNER_MCP_URL: ${STOCK_SCANNER_MCP_URL:-}
    ports: ["8002:8002"]
    depends_on: [dynamodb-local, mcp-server]

  api-backend:
    build: ./services/api-backend
    env_file:
      - path: .env
        required: false
    environment:
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
      MCP_SERVER_URL: http://mcp-server:8001
    ports: ["8080:8080"]
    depends_on: [dynamodb-local, mcp-server]

  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on: [api-backend]
