services:
  dynamodb-local:
    image: amazon/dynamodb-local:2.5.4
    ports: ["8000:8000"]
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]

  mcp-server:
    build:
      context: .
      dockerfile: services/mcp-server/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
      AWS_PROFILE: default
    volumes:
      - ~/.aws:/root/.aws:ro
    ports: ["8001:8001"]
    depends_on: [dynamodb-local]

  # tradingview-mcp-server (github.com/atilaahmettaner/tradingview-mcp) and stock-scanner-mcp
  # (mcpservers.org/servers/yyordanov-tradu/stock-scanner-mcp) both speak MCP over stdio only --
  # neither has a URL a client can just connect to. mcp-proxy (baked into each image, see
  # services/*/Dockerfile) wraps them as subprocesses and exposes an SSE endpoint instead, so
  # scheduler can reach them like any other HTTP dependency on the docker network.
  tradingview-mcp:
    build:
      context: .
      dockerfile: services/tradingview-mcp/Dockerfile
    ports: ["8010:8080"]

  stock-scanner-mcp:
    build:
      context: .
      dockerfile: services/stock-scanner-mcp/Dockerfile
    ports: ["8011:8080"]

  scheduler:
    build:
      context: .
      dockerfile: services/scheduler/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
      OWN_MCP_SERVER_URL: http://mcp-server:8001/mcp
      TRADINGVIEW_MCP_URL: http://tradingview-mcp:8080/sse
      STOCK_SCANNER_MCP_URL: http://stock-scanner-mcp:8080/sse
      AWS_PROFILE: default
    volumes:
      - ~/.aws:/root/.aws:ro
    ports: ["8002:8002"]
    depends_on: [dynamodb-local, mcp-server, tradingview-mcp, stock-scanner-mcp]
    restart: unless-stopped

  api-backend:
    build:
      context: .
      dockerfile: services/api-backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
      OWN_MCP_SERVER_URL: http://mcp-server:8001/mcp
      AWS_PROFILE: default
    volumes:
      - ~/.aws:/root/.aws:ro
    ports: ["8080:8080"]
    depends_on: [dynamodb-local, mcp-server]

  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on: [api-backend]
