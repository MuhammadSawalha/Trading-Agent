server {
    listen 80;

    # A bare `proxy_pass http://api-backend:8080/` resolves the hostname once, at nginx
    # startup, and caches that IP for the container's whole lifetime. Any time api-backend is
    # recreated independently (a rebuild/redeploy without also restarting this container) it
    # gets a new IP on the docker network, and every request here starts failing with 502
    # Bad Gateway ("connection refused") against the now-dead old address until this container
    # happens to restart too. Routing proxy_pass through a variable forces nginx to re-resolve
    # via Docker's embedded DNS (127.0.0.11) on the `valid` interval instead of once, so it
    # picks up the new address on its own.
    resolver 127.0.0.11 valid=10s;

    # api-backend's Prometheus endpoint must NOT be reachable from the internet: this file
    # ships inside the deployed frontend image and the Ingress routes only to the frontend,
    # so without this rule `https://<host>/api/metrics` would anonymously expose per-route
    # request counts and latency histograms, process RSS/FD counts/start time, and the
    # Python version. Prometheus already scrapes it in-cluster, directly against the
    # api-backend Service, via monitoring/prometheus/servicemonitors.yaml.
    #
    # An exact-match (`location = /uri`) block wins over ANY prefix match regardless of
    # order in the file -- nginx checks exact matches first -- so this is not shadowed by
    # `location /api/` below. It is placed first for readability only. `deny all` alone
    # would already return 403; the explicit `return 403` makes that unconditional and
    # independent of any error_page handling.
    location = /api/metrics {
        deny all;
        return 403;
    }

    location /api/ {
        # proxy_pass normally strips the matched `/api/` prefix automatically because its
        # target URI is a compile-time literal -- but once that target is a variable (above),
        # nginx can no longer do that substitution and instead forwards the request URI
        # unchanged, sending upstream a `/api/...` path that doesn't exist there. `rewrite
        # ... break` strips the prefix explicitly first, and proxy_pass here has no URI part
        # of its own so it forwards that already-stripped $uri as-is.
        # `set` must come before `rewrite ... break` -- `break` stops the rewrite module's
        # directive processing for the rest of this location, and `set` is itself a rewrite-
        # module directive, so a `set` placed after `break` never runs.
        set $api_backend_upstream api-backend:8080;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_backend_upstream;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        proxy_buffering off;  # required so SSE responses stream through, not buffer
        chunked_transfer_encoding off;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
