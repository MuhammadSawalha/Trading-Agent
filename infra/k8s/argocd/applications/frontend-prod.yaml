apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/MuhammadSawalha/Trading-Agent.git
    targetRevision: main
    path: infra/k8s/helm/frontend
    helm:
      valueFiles: ["values-prod.yaml"]
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy: {}  # deliberately no automated: {} block — sync stays manual, gated by approval
