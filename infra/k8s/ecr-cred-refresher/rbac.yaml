apiVersion: v1
kind: ServiceAccount
metadata:
  name: ecr-cred-refresher
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ecr-cred-refresher
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["ecr-cred"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ecr-cred-refresher
subjects:
  - kind: ServiceAccount
    name: ecr-cred-refresher
roleRef:
  kind: Role
  name: ecr-cred-refresher
  apiGroup: rbac.authorization.k8s.io
