apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-backend
spec:
  # No replicas field: this Deployment is HPA-managed (templates/hpa.yaml). Setting it here
  # too makes Helm's next server-side apply fight the HPA's scale-subresource writer for
  # ownership of .spec.replicas, failing the upgrade outright once the HPA has scaled away
  # from Values.replicas. Omitting it lets Kubernetes default to 1 replica on first create
  # and leaves the field fully owned by the HPA from then on.
  selector:
    matchLabels: { app: api-backend }
  template:
    metadata:
      labels: { app: api-backend }
    spec:
      containers:
        - name: api-backend
          image: "{{ .Values.image }}:{{ .Values.tag }}"
          ports: [{ name: metrics, containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: api-backend-config }
            - secretRef: { name: api-backend-secrets }
          resources: {{ toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
