apiVersion: v1
kind: Service
metadata:
  name: api-backend
  # ServiceMonitor.spec.selector (monitoring/prometheus/servicemonitors.yaml) matches
  # against this Service's own metadata.labels, not spec.selector below (which only
  # picks the pods this Service routes to) -- so this label is what makes the
  # stock-research-services ServiceMonitor pick up api-backend at all.
  labels: { app: api-backend }
spec:
  selector: { app: api-backend }
  ports: [{ name: metrics, port: 8080, targetPort: 8080 }]
