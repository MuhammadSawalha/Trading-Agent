apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.image }}:{{ .Values.tag }}"
          ports: [{ containerPort: 80 }]
          env:
            # nginx's `resolver` directive skips /etc/resolv.conf's search-domain expansion, so
            # the bare Service name that plain DNS clients resolve fine needs to be fully
            # qualified here instead (see frontend/nginx.conf).
            - name: API_BACKEND_HOST
              value: "api-backend.{{ .Release.Namespace }}.svc.cluster.local"
          resources: {{ toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 5
