apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  # No replicas field: this Deployment is HPA-managed (templates/hpa.yaml). Setting it here
  # too makes Helm's next server-side apply fight the HPA's scale-subresource writer for
  # ownership of .spec.replicas, failing the upgrade outright once the HPA has scaled away
  # from Values.replicas. Omitting it lets Kubernetes default to 1 replica on first create
  # and leaves the field fully owned by the HPA from then on.
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.image }}:{{ .Values.tag }}"
          ports: [{ containerPort: 80 }]
          env:
            # nginx's `resolver` directive skips /etc/resolv.conf's search-domain expansion, so
            # the bare Service name that plain DNS clients resolve fine needs to be fully
            # qualified here instead (see frontend/nginx.conf).
            - name: API_BACKEND_HOST
              value: "api-backend.{{ .Release.Namespace }}.svc.cluster.local"
          resources: {{ toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 5
