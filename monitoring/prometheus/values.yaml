# Helm values for the `kube-prometheus-stack` chart (prometheus-community).
# Install with:
#   helm install kube-prometheus-stack kube-prometheus-stack \
#     --repo https://prometheus-community.github.io/helm-charts \
#     --namespace monitoring --create-namespace \
#     -f monitoring/prometheus/values.yaml \
#     --set grafana.adminPassword=<generated at install time, not committed>
grafana:
  adminPassword: "<set via --set on install, not committed>"
prometheus:
  prometheusSpec:
    # ServiceMonitors are picked up from every namespace (matching servicemonitors.yaml's
    # own `monitoring` namespace and the workloads' `dev`/`prod` namespaces below) rather
    # than only ones this Helm release itself owns.
    serviceMonitorSelectorNilUsesHelmValues: false
    # Same problem, same fix, for PrometheusRule: without this the chart's default
    # ruleSelector only matches rules labeled `release: kube-prometheus-stack`, so
    # monitoring/prometheus/rules/alerts.yaml (which carries no such label, since it's
    # applied independently of this Helm release) is silently never loaded.
    ruleSelectorNilUsesHelmValues: false
