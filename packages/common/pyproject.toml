[project]
name = "common"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    # tracing.py imports langfuse.langchain.CallbackHandler directly, which itself requires
    # the full `langchain` package (not just langchain-core) as a guard check at import
    # time -- see packages/common/common/tracing.py for the verified-against-installed-SDK
    # rationale. Declared here (not just in the services) so common's own CI test job,
    # which installs only packages/common's own deps, can import tracing.py.
    "langfuse>=2.50",
    "langchain>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "moto[dynamodb,s3]>=5.0", "freezegun>=1.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
